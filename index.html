<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon</title>
<style>
  :root {
    --accent: #ed653e;
    --teal: #0c6862;
    --bg: #0c1418;
    --text: #f4f4f2;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 30%, var(--teal) 0%, var(--bg) 70%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    text-align: center;
    padding: 24px;
  }
  .wrap { max-width: 560px; }
  h1 {
    font-size: clamp(2rem, 6vw, 3.2rem);
    margin: 0 0 12px;
    letter-spacing: 0.02em;
  }
  p {
    font-size: 1.05rem;
    color: #cfd8d6;
    margin: 0;
  }
  .accent {
    display: inline-block;
    width: 56px;
    height: 4px;
    background: var(--accent);
    border-radius: 2px;
    margin-bottom: 20px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <span class="accent"></span>
    <h1>Coming Soon</h1>
    <p>This project page is under construction. Please check back soon.</p>
  </div>
</body>
</html>
